<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flor ASCII</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000000;
      color: #ffffff;
      font-family: "Courier New", monospace;
    }

    pre {
      font-size: clamp(15px, 3.5vw, 30px);
      line-height: 1.3;
      margin: 0;
      text-align: center;
    }

    .petalo { color: #fa89e5; }
    .centro { color: #e2a004; }
    .tallo  { color: #044d2b; }
  </style>
</head>
<body>
  <pre>
<span class="petalo">    _.-"""-._
  .'  _..._  '.
 /   .'   '.   \
|   |  <span class="centro">(@)</span>  |   |
 \   '.___.'   /
  '.         .'
    '-.___.-'</span>
<span class="tallo">       \  |  /
        \ | /
         \|/
       \    |  /
        \  | /
         |
          |</span>
  </pre>
</body>
</html>
